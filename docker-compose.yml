services:
  postgres:
    image: postgres:16-alpine
    container_name: sreda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sreda_user
      POSTGRES_PASSWORD: sreda_password
      POSTGRES_DB: sreda_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
